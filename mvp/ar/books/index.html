<style>
:root{--blue:#1A56FF;--cyan:#00D4FF;--navy:#0D1F5C;--mid:#4D7BFF;--ice:#F4F7FF;--muted:#5b6aa0;--line:rgba(13,31,92,.10);--maxw:1180px;--ease:cubic-bezier(.16,.84,.44,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans Arabic','Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--navy);background:#fff;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit;text-decoration:none}
nav{border-bottom:1px solid var(--line);padding:16px 0;position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);z-index:20}
nav .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:17px}.brand span{color:var(--blue)}
.navlink{font-weight:600;font-size:14px;color:var(--muted);transition:.2s}.navlink:hover{color:var(--blue)}
.head{padding-top:52px;padding-bottom:8px}
.head h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;letter-spacing:-.01em}
.head p{color:var(--muted);font-weight:500;margin-top:10px;max-width:640px;line-height:1.7}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-top:28px;padding-bottom:6px}
.filters .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.sel{position:relative}
select{appearance:none;font-family:inherit;font-size:14px;font-weight:700;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:100px;padding:11px 18px 11px 40px;cursor:pointer;transition:.15s;max-width:100%}
select:hover{border-color:var(--mid)}
select.act{background:var(--blue);color:#fff;border-color:var(--blue)}
.sel::after{content:"▾";position:absolute;left:16px;right:auto;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;color:var(--muted)}
.sel.act::after{color:#fff}
.reset{font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;background:none;border:none;padding:8px}
.count{font-size:13px;color:var(--muted);font-weight:600;padding-top:18px;padding-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding-bottom:90px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 18px 44px -24px rgba(13,31,92,.35);transition:transform .3s var(--ease),box-shadow .3s;display:flex;flex-direction:column;min-width:0}
.card:hover{transform:translateY(-5px);box-shadow:0 28px 60px -26px rgba(13,31,92,.45)}
.thumb{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--ice);display:flex;align-items:center;justify-content:center;padding:16px}
.thumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.badge{position:absolute;top:12px;right:12px;left:auto;z-index:2;background:rgba(0,212,255,.94);border-radius:100px;font-size:10px;font-weight:800;letter-spacing:.02em;padding:6px 11px;color:#03303c}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.ml{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.card h3{font-size:16.5px;font-weight:800;line-height:1.3;letter-spacing:-.005em}
.card .author{font-size:13px;font-weight:600;color:var(--muted);margin-top:3px;flex:1}
.amz{margin-top:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13.5px;color:#fff;background:var(--blue);padding:11px 18px;border-radius:100px;transition:transform .2s var(--ease),box-shadow .2s;text-align:center}
.amz:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px rgba(26,86,255,.5)}
.empty{padding:60px 0;text-align:center;color:var(--muted);font-weight:600}
footer{border-top:1px solid var(--line);padding:26px 0;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.aff-disclosure{display:block;font-size:11.5px;color:var(--muted);margin-top:8px}
@media(max-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}.filters{gap:10px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}

/* ===== language switcher (dropdown) ===== */
.langswitch{position:relative;display:inline-block;font-family:'Plus Jakarta Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
.langswitch-btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-weight:700;font-size:14px;line-height:1;color:var(--navy);background:none;padding:9px 14px;border:1px solid var(--line);border-radius:100px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.langswitch-btn:hover{border-color:var(--blue);color:var(--blue)}
.langswitch-btn .globe{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.langswitch-btn .chev{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .2s;flex-shrink:0}
.langswitch.open .langswitch-btn{border-color:var(--blue);color:var(--blue)}
.langswitch.open .langswitch-btn .chev{transform:rotate(180deg)}
.langswitch-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:184px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(13,31,92,.16);padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s var(--ease,ease),transform .18s var(--ease,ease),visibility .18s;z-index:300}
.langswitch.open .langswitch-menu{opacity:1;visibility:visible;transform:none}
.langswitch-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 13px;border-radius:10px;font-size:14.5px;font-weight:700;color:var(--navy);text-decoration:none;transition:background .15s,color .15s}
.langswitch-item:hover{background:var(--ice)}
.langswitch-item.active{color:var(--blue)}
.langswitch-item[lang=ar]{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif}
.langswitch-item .chk{width:15px;height:15px;stroke:var(--blue);fill:none;stroke-width:2.6;opacity:0;flex-shrink:0}
.langswitch-item.active .chk{opacity:1}
[dir=rtl] .langswitch-menu{right:auto;left:0}
@media(max-width:640px){.langswitch-menu{left:0;right:auto}[dir=rtl] .langswitch-menu{right:0;left:auto}}
</style></head><body>
<nav><div class="wrap">
  <a class="brand" href="/">Valentino Scicolone</a>
  <div style="display:flex;align-items:center;gap:14px"><div class="langswitch" data-lang="ar"><button class="langswitch-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language / اللغة" onclick="vlsToggle(this)"><svg class="globe" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg><span class="langswitch-cur">العربية</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="langswitch-menu" role="listbox"><a class="langswitch-item" href="/books" lang="en" hreflang="en" role="option"><span>English</span><svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></a><a class="langswitch-item active" href="/ar/books" lang="ar" hreflang="ar" dir="rtl" role="option"><span>العربية</span><svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></a></div></div><a class="navlink" href="/ar/">→ الرئيسية</a></div>
</div></nav>
<div id="app"><div class="wrap" style="padding-top:80px;padding-bottom:80px;text-align:center;color:var(--muted);font-weight:600">جارٍ تحميل الكتب…</div></div>
<footer><div class="wrap"><span>Valentino Scicolone · مستشار مستقل | التسويق والذكاء الاصطناعي · دبي</span><span>© 2026 vales.ae</span></div><div class="wrap"><span class="aff-disclosure">كشريك في أمازون (Amazon Associate)، أحصل على عمولة عند الشراء عبر الروابط في هذه الصفحة.</span></div></footer>
<script src="/books/data.js"></script>
<script>
let F={category:""};
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const uniq=a=>[...new Set(a)];

function render(){
  const cats=uniq(BOOKS.map(b=>b.category).filter(Boolean)).sort();
  const opt=(v,cur)=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(v)}</option>`;
  const items=BOOKS.filter(b=>!F.category||b.category===F.category).sort((a,b)=>a.displayOrder-b.displayOrder);
  const active=v=>v?" act":"";
  document.getElementById("app").innerHTML=`
   <header class="head wrap">
     <h1>الكتب التي قرأتها</h1>
     <p>كتب ريادة الأعمال والإدارة التي شكّلت فعلاً طريقة عملي. قرأتها كاملةً، لا ملخّصات.</p>
   </header>
   <div class="filters wrap">
     <span class="lbl">تصفية حسب</span>
     <div class="sel${active(F.category)}"><select id="fc"><option value="">الفئة</option>${cats.map(c=>opt(c,F.category)).join("")}</select></div>
     ${F.category?`<button class="reset" id="fr">إعادة ✕</button>`:""}
   </div>
   <div class="count wrap">${items.length} كتاب</div>
   <div class="grid wrap">${items.map(card).join("")||`<div class="empty">لا توجد كتب تطابق هذه التصفية.</div>`}</div>`;
  document.getElementById("fc").onchange=e=>{F.category=e.target.value;render();};
  const fr=document.getElementById("fr"); if(fr) fr.onclick=()=>{F={category:""};render();};
}

function card(b,i){
  const url=b.amazonUrl;
  const eager=i<4;
  return `<div class="card">
    <div class="thumb">${b.featured?`<span class="badge">موصى به</span>`:""}<img src="${esc(b.coverImage)}" alt="${esc(b.title)} cover" loading="${eager?"eager":"lazy"}" decoding="async" ${eager?'fetchpriority="high"':''} onerror="this.style.display='none'"></div>
    <div class="body">
      <div class="ml">${esc(b.category)}</div>
      <h3>${esc(b.title)}</h3>
      <div class="author">${esc(b.author)}</div>
      ${url?`<a class="amz" href="${esc(url)}" target="_blank" rel="sponsored nofollow noopener noreferrer" aria-label="View ${esc(b.title)} on Amazon.ae (affiliate link)">عرض على Amazon.ae ↗</a>`:""}
    </div>
  </div>`;
}
render();

const itemList={
  "@context":"https://schema.org",
  "@type":"ItemList",
  "name":"Books I've read",
  "url":"https://vales.ae/ar/books",
  "itemListElement":BOOKS.sort((a,b)=>a.displayOrder-b.displayOrder).map((b,i)=>({
    "@type":"ListItem",
    "position":i+1,
    "item":{"@type":"Book","name":b.title,"author":{"@type":"Person","name":b.author},"url":b.amazonUrl}
  }))
};
const ldScript=document.createElement("script");
ldScript.type="application/ld+json";
ldScript.textContent=JSON.stringify(itemList);
document.head.appendChild(ldScript);
</script>

<script>
/* language switcher dropdown */
(function(){
  window.vlsToggle=function(btn){var ls=btn.closest('.langswitch');var open=ls.classList.toggle('open');btn.setAttribute('aria-expanded',open);};
  document.addEventListener('click',function(e){document.querySelectorAll('.langswitch.open').forEach(function(ls){if(!ls.contains(e.target))ls.classList.remove('open');});});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.langswitch.open').forEach(function(ls){ls.classList.remove('open');});});
})();
</script>
</body></html>
